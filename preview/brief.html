<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude Fund · 시장 브리프</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:light;
 --bg:#F2F4F6; --card:#FFFFFF; --card2:#F8F9FA;
 --ink:#191F28; --ink2:#4E5968; --ink3:#6B7684; --line:#E5E8EB;
 --up:#F04452; --down:#3182F6; --flat:#8B95A1;
 --accent:#3182F6; --accent-ink:#FFFFFF;
 --up-bg:#FDEDEE; --down-bg:#EAF2FE;
 --shadow:0 1px 3px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.05);
 --radius:20px; --radius-s:14px;}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#0E1117; --card:#171C26; --card2:#1E2430;
 --ink:#ECEFF4; --ink2:#A8B0C0; --ink3:#98A2B3; --line:#252C3B;
 --up:#F45B69; --down:#5A97F7; --flat:#5E6979;
 --up-bg:#2A1A20; --down-bg:#16233A;
 --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0E1117; --card:#171C26; --card2:#1E2430;
 --ink:#ECEFF4; --ink2:#A8B0C0; --ink3:#98A2B3; --line:#252C3B;
 --up:#F45B69; --down:#5A97F7; --flat:#5E6979;
 --up-bg:#2A1A20; --down-bg:#16233A;
 --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
 font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
 font-size:15px;line-height:1.5;word-break:keep-all;padding-bottom:88px}
.n{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--ink3)}
.app{max-width:640px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}

/* 상단 앱바 */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.appbar-in{max-width:640px;margin:0 auto;padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between}
.appbar b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.appbar .mini{font-size:13px;color:var(--ink3)}

/* 히어로 */
.hero{padding:28px 0 8px}
.hero .label{font-size:13px;color:var(--ink3);font-weight:500}
.hero .total{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.15;margin-top:2px}
.hero .delta{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:15px;font-weight:600}
.hero .chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.chip.up{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}
.chip.flat{background:var(--card2);color:var(--ink3)}

/* 카드 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin:14px 0}
.card h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 a{font-size:12px;color:var(--ink3);font-weight:500}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
.kpis>div{padding:9px 0}
.kpis .k{font-size:12px;color:var(--ink3)}
.kpis .v{font-size:17px;font-weight:700;margin-top:2px}

/* 행 리스트 */
.row{display:flex;align-items:center;gap:13px;padding:13px 0}
.row+.row{border-top:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:14px;background:var(--card2);color:var(--ink2);
 display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.row .mid{flex:1;min-width:0}
.row .name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.row .sub{font-size:12.5px;color:var(--ink3);margin-top:1px}
.row .right{text-align:right}
.row .amt{font-size:15px;font-weight:700}
.row .chg{font-size:12.5px;font-weight:600;margin-top:1px}

/* 판단 카드 */
.decision p{font-size:14.5px;line-height:1.75;color:var(--ink2)}
.decision .date{font-size:12px;color:var(--ink3);margin-bottom:8px}

/* 차트 */
.chart svg{width:100%;display:block}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:14px}
.seg span{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink3);padding:7px 0;border-radius:9px}
.seg .on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* 체결 리스트 */
.day{font-size:12.5px;font-weight:600;color:var(--ink3);margin:20px 0 4px}
.trade-side{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:2px}
.trade-side.buy{background:var(--up-bg);color:var(--up)}
.trade-side.sell{background:var(--down-bg);color:var(--down)}
details.why{margin-top:6px}
details.why summary{font-size:12px;color:var(--ink3);cursor:pointer;list-style:none}
details.why summary::before{content:"매매 사유 ▾ "}
details.why[open] summary::before{content:"매매 사유 ▴ "}
details.why p{font-size:13px;line-height:1.7;color:var(--ink2);margin-top:6px;
 background:var(--card2);border-radius:var(--radius-s);padding:12px 14px}

/* 하단 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
 background:color-mix(in srgb,var(--card) 92%,transparent);
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar-in{max-width:640px;margin:0 auto;display:flex}
.tab{flex:1;text-align:center;padding:9px 0 max(9px,env(safe-area-inset-bottom));font-size:10.5px;color:var(--ink3);font-weight:600}
.tab svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.footnote{font-size:11.5px;color:var(--ink3);line-height:1.7;padding:18px 2px 8px}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.row:active,.card:active{transform:scale(.995)}}
</style></head><body>
<div class="appbar"><div class="appbar-in"><b>Claude Fund</b><span class="mini n">2026-09-04 종가 · 미리보기</span></div></div>
<main class="app"><div class="hero"><h1 style="font-size:26px">시장 브리프</h1></div><section class="card"><p>시장 요약과 주요 뉴스</p><a class="row" href="../brief.html">시장 브리프 보기 →</a></section>
<footer class="footnote"><p>모의투자 · 초기 자금 1억 원 · 투자 권유가 아닙니다.</p><details><summary>손익 계산 안내</summary><p>총손익은 매수 수수료를 포함합니다. 실현손익과 평가손익의 합계에서는 매수 수수료가 빠져 있습니다.</p></details></footer>
</main>

</body></html>
